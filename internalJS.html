<!DOCTYPE html>
<html>
<head>
     <title>Internal JavaScript</title>
    <script>
        function myFunction() {
            document.getElementById("demo").innerHTML = "Paragraph changed.";
        }
    </script>
</head>

<body>
    <p>Akhil Hamal</p>

    <p id="demo">A Paragraph.</p>

    <button type="button" onclick="myFunction()">
        Try it
    </button>
</body>
</html>
